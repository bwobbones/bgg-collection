<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vibrant Violet-Rose Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Front Amber Die Gradient -->
    <linearGradient id="frontDie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Back Coral Die Gradient -->
    <linearGradient id="backDie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Meeple Gold Gradient -->
    <linearGradient id="meepleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Dynamic 3D Drop Shadow -->
    <filter id="actionShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Container Badge -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="124" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.25" />

  <!-- Action Sparks / Motion Burst Lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4">
    <line x1="80" y1="120" x2="110" y2="150" />
    <line x1="430" y1="110" x2="400" y2="140" />
    <line x1="430" y1="390" x2="405" y2="365" />
    <line x1="90" y1="380" x2="115" y2="355" />
  </g>

  <!-- 1. BACK TILTED DIE (Coral Red, showing 3 pips) -->
  <g transform="translate(195, 235) rotate(-22)" filter="url(#actionShadow)">
    <rect x="-105" y="-105" width="210" height="210" rx="44" fill="url(#backDie)" stroke="#ffffff" stroke-width="6" />
    <!-- Diagonal 3 pips -->
    <circle cx="-50" cy="-50" r="18" fill="#ffffff" />
    <circle cx="0" cy="0" r="18" fill="#ffffff" />
    <circle cx="50" cy="50" r="18" fill="#ffffff" />
  </g>

  <!-- 2. FRONT TILTED DIE (Golden Amber, showing 5 pips) -->
  <g transform="translate(305, 305) rotate(16)" filter="url(#actionShadow)">
    <rect x="-105" y="-105" width="210" height="210" rx="44" fill="url(#frontDie)" stroke="#ffffff" stroke-width="6" />
    <!-- Classic 5 pips -->
    <circle cx="-50" cy="-50" r="18" fill="#78350f" />
    <circle cx="50" cy="-50" r="18" fill="#78350f" />
    <circle cx="0" cy="0" r="22" fill="#78350f" />
    <circle cx="-50" cy="50" r="18" fill="#78350f" />
    <circle cx="50" cy="50" r="18" fill="#78350f" />
  </g>

  <!-- 3. CLASSIC BOARD GAME MEEPLE (Trophy Icon on Top Left) -->
  <g transform="translate(140, 160) rotate(-8)" filter="url(#softGlow)">
    <!-- Meeple Head -->
    <circle cx="0" cy="-44" r="24" fill="url(#meepleGold)" stroke="#4338ca" stroke-width="4" />
    <!-- Meeple Shoulders & Body & Feet -->
    <path d="M-18 -26 C-24 -24 -36 -12 -50 0 C-46 14 -38 18 -28 14 L-28 48 C-28 54 -20 58 -10 58 L-4 34 L4 34 L10 58 C20 58 28 54 28 48 L28 14 C38 18 46 14 50 0 C36 -12 24 -24 18 -26 Z" 
          fill="url(#meepleGold)" stroke="#4338ca" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Tiny Gold Star Sparkle -->
  <g transform="translate(390, 140) scale(1.1)">
    <path d="M0 -22 L6 -6 L22 0 L6 6 L0 22 L-6 6 L-22 0 L-6 -6 Z" fill="#fef08a" filter="url(#softGlow)" />
  </g>
</svg>
