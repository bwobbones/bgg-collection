<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vibrant Radial Burst -->
    <radialGradient id="spaceBurst" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Top Hex Face Gradient -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Left Hex Face Gradient -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Right Hex Face Gradient -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="60%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Golden Crown Gradient -->
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="epicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.6" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Space Gradient -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#spaceBurst)" />
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.4" />

  <!-- Background Orbit Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.3" />

  <!-- Sparkling Stars in Background -->
  <g filter="url(#starGlow)" fill="#ffffff">
    <!-- Star 1 -->
    <path d="M90 120 L96 138 L114 144 L96 150 L90 168 L84 150 L66 144 L84 138 Z" opacity="0.85" />
    <!-- Star 2 -->
    <path d="M410 110 L415 125 L430 130 L415 135 L410 150 L405 135 L390 130 L405 125 Z" opacity="0.85" />
    <!-- Small sparkles -->
    <circle cx="120" cy="380" r="4" opacity="0.8" />
    <circle cx="390" cy="370" r="5" opacity="0.8" />
    <circle cx="256" cy="70" r="3" opacity="0.9" />
  </g>

  <!-- 3D ISOMETRIC BOARD GAME TILE / DICE CUBE -->
  <g filter="url(#epicGlow)" transform="translate(256, 275)">
    <!-- Top Face (Rhombus) -->
    <path d="M0 -125 L120 -55 L0 15 L-120 -55 Z" fill="url(#topFace)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

    <!-- Left Face -->
    <path d="M-120 -55 L0 15 L0 145 L-120 75 Z" fill="url(#leftFace)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

    <!-- Right Face -->
    <path d="M0 15 L120 -55 L120 75 L0 145 Z" fill="url(#rightFace)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

    <!-- Isometric Dice Pips on Top Face -->
    <ellipse cx="0" cy="-55" rx="14" ry="8" fill="#78350f" />
    <ellipse cx="-60" cy="-85" rx="12" ry="7" fill="#78350f" />
    <ellipse cx="60" cy="-25" rx="12" ry="7" fill="#78350f" />
    <ellipse cx="-60" cy="-25" rx="12" ry="7" fill="#78350f" />
    <ellipse cx="60" cy="-85" rx="12" ry="7" fill="#78350f" />

    <!-- Isometric Pips on Left Face -->
    <ellipse cx="-60" cy="45" rx="11" ry="16" fill="#450a0a" transform="rotate(-15 -60 45)" />
    <ellipse cx="-60" cy="105" rx="11" ry="16" fill="#450a0a" transform="rotate(-15 -60 105)" />

    <!-- Isometric Pips on Right Face -->
    <ellipse cx="60" cy="45" rx="11" ry="16" fill="#4c0519" transform="rotate(15 60 45)" />
    <ellipse cx="60" cy="105" rx="11" ry="16" fill="#4c0519" transform="rotate(15 60 105)" />
    <ellipse cx="60" cy="75" rx="11" ry="16" fill="#4c0519" transform="rotate(15 60 75)" />
  </g>

  <!-- FLOATING GOLDEN CROWN ON TOP -->
  <g transform="translate(256, 120)" filter="url(#epicGlow)">
    <path d="M-60 0 L-45 -45 L-15 -20 L0 -55 L15 -20 L45 -45 L60 0 Z" fill="url(#goldCrown)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    <!-- Crown Jewels -->
    <circle cx="-45" cy="-45" r="5" fill="#f43f5e" stroke="#fff" stroke-width="1.5" />
    <circle cx="0" cy="-55" r="6" fill="#38bdf8" stroke="#fff" stroke-width="1.5" />
    <circle cx="45" cy="-45" r="5" fill="#f43f5e" stroke="#fff" stroke-width="1.5" />
    <circle cx="0" cy="-12" r="4" fill="#a855f7" />
  </g>
</svg>
