<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Center White Dice with Dots -->
  <g transform="translate(106, 106)">
    <!-- 3D Dice Body -->
    <rect x="0" y="0" width="300" height="300" rx="64" fill="#ffffff" />
    
    <!-- Dice Dots -->
    <circle cx="75" cy="75" r="28" fill="#0f172a" />
    <circle cx="225" cy="75" r="28" fill="#0f172a" />
    <circle cx="150" cy="150" r="32" fill="#ea580c" />
    <circle cx="75" cy="225" r="28" fill="#0f172a" />
    <circle cx="225" cy="225" r="28" fill="#0f172a" />
  </g>
</svg>
