<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vibrant Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Drop Shadow for Die -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Pip Gradient -->
    <linearGradient id="pipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded Badge Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGradient)" />

  <!-- Clean Crisp White Die Floating in Center -->
  <rect x="100" y="100" width="312" height="312" rx="68" fill="#ffffff" filter="url(#cardShadow)" />

  <!-- 5 Red/Orange Pips (The classic board game dice symbol) -->
  <!-- Top Left Pip -->
  <circle cx="176" cy="176" r="28" fill="url(#pipGrad)" />

  <!-- Top Right Pip -->
  <circle cx="336" cy="176" r="28" fill="url(#pipGrad)" />

  <!-- Center Pip -->
  <circle cx="256" cy="256" r="34" fill="url(#pipGrad)" />

  <!-- Bottom Left Pip -->
  <circle cx="176" cy="336" r="28" fill="url(#pipGrad)" />

  <!-- Bottom Right Pip -->
  <circle cx="336" cy="336" r="28" fill="url(#pipGrad)" />
</svg>
